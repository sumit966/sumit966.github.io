name: Daily Commit

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Daily update: $(date)" >> heartbeat.txt
          git config user.name "sumit966"
          git config user.email "73360576+sumit966@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore: daily heartbeat $(date +%Y-%m-%d)" || echo "No changes"
          git push
